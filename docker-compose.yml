services:
  app:
    image: ${CORE_IMAGE:-ghcr.io/anhnamri9x26/lexi-cms-core:0.1.1-canary.3}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CONTENT_DIR: /app/content
      DATABASE_URL: postgresql://${POSTGRES_USER:-ezitrans}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-ezitrans}
      UPDATE_AGENT_URL: http://update-agent:4577
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-change-me}
      INTERNAL_HEALTH_TOKEN: ${INTERNAL_HEALTH_TOKEN:-change-me}
      LEXI_UPDATE_REGISTRY_URL: ${LEXI_UPDATE_REGISTRY_URL:-http://update-registry:4580}
      LEXI_UPDATE_CHANNEL: ${LEXI_UPDATE_CHANNEL:-canary}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - site-content:/app/content
    depends_on:
      content-init:
        condition: service_completed_successfully
      db:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  content-init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "cp -an /source/. /target/"]
    volumes:
      - ./content:/source:ro
      - site-content:/target

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ezitrans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ezitrans}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  update-agent:
    build:
      context: ./update-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-change-me}
      INTERNAL_HEALTH_TOKEN: ${INTERNAL_HEALTH_TOKEN:-change-me}
      CONTENT_DIR: /agent/content
      APP_SERVICE_NAME: app
      APP_READY_URL: http://app:3000/api/health/ready
      COMPOSE_PROJECT_DIR: /workspace
      COMPOSE_FILE_PATH: /workspace/docker-compose.yml
      COMPOSE_ENV_FILE: /workspace/.env
      SIMULATE_UPDATES: ${SIMULATE_UPDATES:-true}
      CORE_IMAGE_REPOSITORY: ${CORE_IMAGE_REPOSITORY:-ghcr.io/anhnamri9x26/lexi-cms-core}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-ezitransvn}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ezitrans}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-ezitrans}
    volumes:
      - site-content:/agent/content
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
    expose:
      - "4577"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  update-registry:
    build:
      context: ./update-registry
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REGISTRY_PORT: 4580
      REGISTRY_DATA_DIR: /registry/data
    volumes:
      - ./update-registry/data:/registry/data
    expose:
      - "4580"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4580/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  site-content:
    name: ezitrans-content
