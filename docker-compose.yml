services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CORE_IMAGE_REPOSITORY:-ezitrans-cms}:${CORE_VERSION:-local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CONTENT_DIR: /app/content
      DATABASE_URL: postgresql://${POSTGRES_USER:-ezitrans}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-ezitrans}
      UPDATE_AGENT_URL: http://update-agent:4577
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-change-me}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./content:/app/content
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ezitrans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ezitrans}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  update-agent:
    build:
      context: ./update-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-change-me}
      CONTENT_DIR: /agent/content
      APP_SERVICE_NAME: app
      COMPOSE_PROJECT_DIR: /workspace
      SIMULATE_UPDATES: ${SIMULATE_UPDATES:-true}
      APP_HEALTH_URL: ${APP_HEALTH_URL:-http://app:3000/api/system/health}
      CORE_IMAGE_REPOSITORY: ${CORE_IMAGE_REPOSITORY:-ezitrans-cms}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-ezitransvn}
    volumes:
      - ./content:/agent/content
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${UPDATE_AGENT_PORT:-4577}:4577"

