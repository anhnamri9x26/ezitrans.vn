services:
  app:
    image: your-registry/ezitrans-cms:${CORE_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CONTENT_DIR: /app/content
      UPDATE_AGENT_URL: http://update-agent:4577
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./content:/app/content
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ezitrans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ezitrans}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  update-agent:
    image: your-registry/ezitrans-update-agent:${CORE_VERSION:-latest}
    restart: unless-stopped
    environment:
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN}
      CONTENT_DIR: /agent/content
      APP_SERVICE_NAME: app
      COMPOSE_PROJECT_DIR: /workspace
      SIMULATE_UPDATES: "false"
    volumes:
      - ./content:/agent/content
      - ./:/workspace
