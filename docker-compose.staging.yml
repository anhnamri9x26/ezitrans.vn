services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CORE_VERSION: ${CORE_VERSION:-0.1.0}
        CORE_GIT_SHA: staging-local
        CORE_BUILD_TIME: staging-local
    image: ${STAGING_APP_IMAGE:-lexi-cms-staging:${CORE_VERSION:-0.1.0}}
    env_file: [.env.staging]
    environment:
      NODE_ENV: production
      CONTENT_DIR: /app/content
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPDATE_AGENT_URL: http://update-agent:4577
      LEXI_UPDATE_REGISTRY_URL: http://update-registry:4580
    ports: ["${APP_PORT:-3016}:3000"]
    volumes: ["./staging-data/content:/app/content"]
    depends_on:
      db: { condition: service_healthy }
      update-registry: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  db:
    image: postgres:16-alpine
    env_file: [.env.staging]
    ports: ["${POSTGRES_PORT:-5442}:5432"]
    volumes: ["./staging-data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  update-registry:
    build: { context: ./update-registry, dockerfile: Dockerfile }
    environment: { REGISTRY_PORT: 4580, REGISTRY_DATA_DIR: /registry/data }
    volumes: ["./update-registry/data:/registry/data"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4580/health"]
      interval: 5s
      timeout: 3s
      retries: 10
  update-agent:
    build: { context: ./update-agent, dockerfile: Dockerfile }
    env_file: [.env.staging]
    environment:
      CONTENT_DIR: /agent/content
      APP_SERVICE_NAME: app
      APP_READY_URL: http://app:3000/api/health/ready
      COMPOSE_PROJECT_DIR: /workspace
      CORE_IMAGE_REPOSITORY: ghcr.io/anhnamri9x26/lexi-cms-core
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./staging-data/content:/agent/content
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [db]
