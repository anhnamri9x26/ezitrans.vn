name: Deploy Ezitrans Production
"on":
  workflow_dispatch:
    inputs:
      version: { description: Immutable release version, required: true, type: string }
      revision: { description: Full Git commit SHA, required: true, type: string }
permissions: { contents: read, packages: write }
concurrency: { group: ezitrans-production, cancel-in-progress: false }
env: { IMAGE: ghcr.io/anhnamri9x26/ezitrans-cms }
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ inputs.revision }} }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run release:validate
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          labels: |
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.EZITRANS_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EZITRANS_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload deployment scripts
        run: scp -P "${{ secrets.EZITRANS_VPS_PORT }}" ops/deploy-production.sh ops/rollback-production.sh "${{ secrets.EZITRANS_VPS_USER }}@${{ secrets.EZITRANS_VPS_HOST }}:/home/ezitrans.vn/next-cms/ops/"
      - name: Deploy immutable image
        run: ssh -p "${{ secrets.EZITRANS_VPS_PORT }}" "${{ secrets.EZITRANS_VPS_USER }}@${{ secrets.EZITRANS_VPS_HOST }}" "chmod 700 /home/ezitrans.vn/next-cms/ops/*.sh && /home/ezitrans.vn/next-cms/ops/deploy-production.sh '${{ env.IMAGE }}:${{ inputs.version }}'"
      - name: Release summary
        run: |
          echo "## Ezitrans deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: ${{ inputs.revision }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"