name: Release Lexi CMS Core
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version (for example 1.5.0)
        required: true
      channel:
        description: Release channel
        required: true
        default: canary
        type: choice
        options: [internal, canary, stable]
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: release-core-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lexi-cms-core
jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lexi
          POSTGRES_PASSWORD: lexi-test
          POSTGRES_DB: lexi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lexi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lexi:lexi-test@localhost:5432/lexi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:validate
      - name: Apply production migrations on clean database
        run: npx prisma migrate deploy
      - name: Resolve version
        id: release
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          node -e "if(!/^\\d+\\.\\d+\\.\\d+([+-][0-9A-Za-z.-]+)?$/.test(process.argv[1]))process.exit(1)" "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            CORE_VERSION=${{ steps.release.outputs.version }}
            CORE_GIT_SHA=${{ github.sha }}
            CORE_BUILD_TIME=${{ steps.release.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Output immutable release data
        run: |
          echo "Image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          echo "Version: ${{ steps.release.outputs.version }}"
          echo "Channel: ${{ inputs.channel || 'canary' }}"
          echo "Publish a signed manifest to LEXI_UPDATE_REGISTRY_URL as the promotion step."
